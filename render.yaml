services:
  - type: web
    name: biasmirror-api
    runtime: node
    plan: starter
    rootDir: .
    buildCommand: npm install
    startCommand: npm --workspace server run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: ML_SERVICE_URL
        value: https://biasmirror-ml.onrender.com
      - key: CLIENT_URL
        value: https://biasmirror-client.onrender.com
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: BiasMirror Admin

  - type: web
    name: biasmirror-ml
    runtime: python
    plan: starter
    rootDir: .
    buildCommand: python -m pip install -r ml-service/requirements.txt
    startCommand: python -m uvicorn --app-dir ml-service app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MODEL_VERSION
        value: biasmirror-rf-v1

  - type: static
    name: biasmirror-client
    rootDir: .
    buildCommand: npm install && npm --workspace client run build
    staticPublishPath: client/dist
    envVars:
      - key: VITE_API_URL
        value: https://biasmirror-api.onrender.com
